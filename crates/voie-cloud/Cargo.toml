[package]
name = "voie-cloud"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "voie-cloud"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
bytes = "1.10"
hmac = "0.12"
http-body-util = "0.1"
httpdate = "1.0"
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
ring = "0.17"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "tls-rustls-ring-native-roots"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
voie-pack = { path = "../voie-pack" }
