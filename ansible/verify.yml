- name: Verify control VM
  hosts: control
  gather_facts: false
  tasks:
    - name: Headscale unit is active
      ansible.builtin.systemd:
        name: headscale
      register: headscale_unit
      failed_when: headscale_unit.status.ActiveState != "active"

    - name: voie-cloud unit is active
      ansible.builtin.systemd:
        name: voie-cloud
      register: voie_cloud_unit
      failed_when: voie_cloud_unit.status.ActiveState != "active"

    - name: TLS ingress unit is active
      ansible.builtin.systemd:
        name: voie-ingress
      register: ingress_unit
      failed_when: ingress_unit.status.ActiveState != "active"

    - name: Application wildcard development certificate is installed
      ansible.builtin.stat:
        path: /etc/voie/certs/wildcard-dev.crt
      register: wildcard_dev_crt
      failed_when: not wildcard_dev_crt.stat.exists

    - name: Application wildcard production certificate is installed
      ansible.builtin.stat:
        path: /etc/voie/certs/wildcard-prod.crt
      register: wildcard_prod_crt
      failed_when: not wildcard_prod_crt.stat.exists

    - name: Public Caddyfile serves Application wildcard hosts
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - "*.dev."
          - /etc/voie/Caddyfile
      changed_when: false

    - name: voie-cloud answers locally
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
        method: GET
        status_code: 200

    - name: PostgreSQL accepts verified TLS
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - "{{ postgres_fqdn }}:5432"
          - -starttls
          - postgres
          - -verify_return_error
          - -brief
        stdin: ""
      changed_when: false

    - name: PostgreSQL accepts a verified client
      ansible.builtin.command:
        argv:
          - psql
          - service=voie
          - -v
          - ON_ERROR_STOP=1
          - -c
          - select 1
      environment:
        PGSERVICEFILE: /etc/voie/secrets/postgres-service.conf
      no_log: true
      changed_when: false

    - name: Headscale reports the fabric user
      ansible.builtin.command:
        argv:
          - headscale
          - -c
          - /etc/voie/headscale.yaml
          - users
          - list
          - -o
          - json
      register: headscale_users
      changed_when: false
      failed_when: "'fabric' not in headscale_users.stdout"

- name: Verify baremetal-1
  hosts: fabric
  gather_facts: false
  vars:
    k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: K3s unit is active
      ansible.builtin.systemd:
        name: k3s
      register: k3s_unit
      failed_when: k3s_unit.status.ActiveState != "active"

    - name: K3s node is Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ k3s_kubeconfig }}"
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=180s
      changed_when: false

    - name: Cilium pods are Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ k3s_kubeconfig }}"
          - wait
          - --for=condition=Ready
          - pods
          - -n
          - kube-system
          - -l
          - k8s-app=cilium
          - --timeout=180s
      changed_when: false

    - name: RuntimeClass voie-firecracker exists
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ k3s_kubeconfig }}"
          - get
          - runtimeclass
          - voie-firecracker
          - -o
          - jsonpath={.handler}
      register: runtimeclass
      changed_when: false
      # The patched runtime-rs shim is the only Firecracker handler (FAB1).
      failed_when: runtimeclass.stdout != "kata-fc-rs-voie"

    - name: Patched runtime-rs containerd drop-in is installed
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/voie-kata-fc-rs.toml
      register: kata_drop_in
      failed_when: not kata_drop_in.stat.exists

    - name: Runtime thin pool exists
      ansible.builtin.command:
        argv:
          - lvs
          - voie-ws/runtime
      changed_when: false

    - name: Runtime thin pool is 64G
      ansible.builtin.command:
        argv:
          - lvs
          - --noheadings
          - --nosuffix
          - --units
          - g
          - -o
          - lv_size
          - voie-ws/runtime
      register: runtime_pool_size
      changed_when: false
      failed_when: (runtime_pool_size.stdout | trim | float) < 63

    - name: Volume group holds runtime, product budget, and recovery reserve
      ansible.builtin.command:
        argv:
          - vgs
          - --noheadings
          - --nosuffix
          - --units
          - g
          - -o
          - vg_size
          - voie-ws
      register: vg_size
      changed_when: false
      failed_when: (vg_size.stdout | trim | float) < 475

    - name: Retired staging LV is absent
      ansible.builtin.command:
        argv:
          - lvs
          - voie-ws/stage
      register: staging_lv
      changed_when: false
      failed_when: staging_lv.rc == 0

    - name: Fabric VG lives on a dedicated data PV, not the OS disk
      ansible.builtin.shell: |
        set -euo pipefail
        os_src="$(findmnt -n -o SOURCE /)"
        os_pk="$(lsblk -no PKNAME "$os_src" | head -1)"
        pv="$(pvs --noheadings -o pv_name -S vg_name=voie-ws | tr -d ' ')"
        pv_pk="$(lsblk -no PKNAME "$pv" | head -1)"
        test -n "$os_pk"
        test -n "$pv_pk"
        test "$os_pk" != "$pv_pk"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Workspace thin-pool metadata volume exists
      ansible.builtin.command:
        argv:
          - lvs
          - -a
          - voie-ws/workspace_tmeta
      changed_when: false

    - name: Runtime thin-pool metadata volume exists
      ansible.builtin.command:
        argv:
          - lvs
          - -a
          - voie-ws/runtime_tmeta
      changed_when: false

    - name: Recovery reserve is physically unallocated
      ansible.builtin.command:
        argv:
          - vgs
          - --noheadings
          - --nosuffix
          - --units
          - g
          - -o
          - vg_free
          - voie-ws
      register: vg_free
      changed_when: false
      failed_when: (vg_free.stdout | trim | float) < 48

    - name: Retired product thin pool is absent
      ansible.builtin.command:
        argv:
          - lvs
          - voie-ws/workspaces
      register: legacy_workspaces_pool
      changed_when: false
      failed_when: legacy_workspaces_pool.rc == 0

    - name: Retired ws-root is absent
      ansible.builtin.command:
        argv:
          - lvs
          - voie-ws/ws-root
      register: legacy_ws_root
      changed_when: false
      failed_when: legacy_ws_root.rc == 0

    - name: Workspace thin pool exists
      ansible.builtin.command:
        argv:
          - lvs
          - --noheadings
          - --nosuffix
          - --units
          - g
          - -o
          - lv_size
          - voie-ws/workspace
      register: workspace_pool_size
      changed_when: false
      failed_when: (workspace_pool_size.stdout | trim | float) < 263

    - name: Retired ws-root is absent from fstab
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - "voie--ws-ws--root|/dev/voie-ws/ws-root"
          - /etc/fstab
      register: fstab_ws_root
      changed_when: false
      failed_when: fstab_ws_root.rc == 0

    - name: Recovery reserve is unallocated
      ansible.builtin.command:
        argv:
          - lvs
          - voie-ws/reserve
      register: reserved_lv
      changed_when: false
      failed_when: reserved_lv.rc == 0

    - name: Recovery LV name is absent
      ansible.builtin.command:
        argv:
          - lvs
          - voie-ws/recovery
      register: recovery_lv
      changed_when: false
      failed_when: recovery_lv.rc == 0

    - name: Retired 200Gi workspace pool PV is absent
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ k3s_kubeconfig }}"
          - get
          - pv
          - voie-ws-pool
      register: legacy_ws_pool_pv
      changed_when: false
      failed_when: legacy_ws_pool_pv.rc == 0

    - name: Competing local-path allocator is absent
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ k3s_kubeconfig }}"
          - get
          - storageclass
          - local-path
      register: local_path_sc
      changed_when: false
      failed_when: local_path_sc.rc == 0

    - name: Retired workspace LV size is absent from fabric.env
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - VOIE_WORKSPACE_LV_SIZE
          - /etc/voie/fabric.env
      register: retired_lv_size
      changed_when: false
      failed_when: retired_lv_size.rc == 0

    - name: Retired staging volume env is absent
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - VOIE_FABRICD_STAGE_VOLUME
          - /etc/voie/fabric.env
      register: retired_stage_volume
      changed_when: false
      failed_when: retired_stage_volume.rc == 0

    - name: Platform storage tiers are in fabric.env
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - "{{ item }}"
          - /etc/voie/fabric.env
      loop:
        - VOIE_STORAGE_RUNTIME_POOL=64G
        - VOIE_STORAGE_WORKSPACE_POOL=workspace
        - VOIE_STORAGE_WORKSPACE_POOL_DATA=264G
        - VOIE_STORAGE_WORKSPACE_NORMAL_BUDGET=128G
        - VOIE_STORAGE_WORKSPACE_RESTORE_HEADROOM=64G
        - VOIE_STORAGE_STAGING=0
        - VOIE_STORAGE_WORKSPACE_DEFAULT=16G
        - VOIE_STORAGE_WORKSPACE_LARGE=32G
        - VOIE_STORAGE_WORKSPACE_ELEVATED=64G
        - VOIE_STORAGE_LINEAR_NORMAL_BUDGET=96G
        - VOIE_STORAGE_LINEAR_RECOVERY_RESERVE=48G
        - VOIE_STORAGE_EMERGENCY_FLOOR=16G
        - VOIE_STORAGE_DATABASE_DEV=8G
        - VOIE_STORAGE_DATABASE_DEV_ELEVATED=16G
        - VOIE_STORAGE_DATABASE_PROD=16G
        - VOIE_STORAGE_DATABASE_PROD_ELEVATED=32G
        - VOIE_STORAGE_DEPLOYMENT=1G
        - VOIE_FABRICD_STAGE_ROOT=/var/lib/voie-fabricd/stage
        - VOIE_FABRICD_STAGE_MODE=none
      changed_when: false

    - name: k3s local-storage allocator is disabled
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - local-storage
          - /etc/voie/k3s/config.yaml
      changed_when: false

    - name: Containerd snapshotter uses the runtime thin pool
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - pool_name = "voie--ws-runtime"
          - /etc/voie/k3s/containerd-config.toml.tmpl
      changed_when: false

    - name: Tailscale is connected
      ansible.builtin.command:
        argv:
          - tailscale
          - status
          - --json
      register: tailscale_status
      changed_when: false
      failed_when: "'BackendState' not in tailscale_status.stdout"

    - name: voie-fabricd binary is present
      ansible.builtin.command:
        argv:
          - voie-fabricd
          - --version
      changed_when: false

    - name: voie-fabricd unit is enabled
      ansible.builtin.systemd:
        name: voie-fabricd
      register: fabricd_unit
      failed_when: not (fabricd_unit.status.UnitFileState == "enabled")

- name: Verify public endpoints
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Product HTTPS is reachable
      ansible.builtin.uri:
        url: "https://{{ public_hostname }}/healthz"
        method: GET
        status_code: 200
        validate_certs: true
      retries: 30
      delay: 5

    # C8 requires public management SSH closed. live-c7 skip-tags this.
    - name: Public management SSH is closed
      ansible.builtin.wait_for:
        host: "{{ control_public_ip }}"
        port: 22
        state: stopped
        timeout: 15
      tags:
        - closed_management
